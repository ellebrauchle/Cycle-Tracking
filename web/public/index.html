<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petal Ping</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B4476B">
<style>
  :root {
    --rose: #B4476B;
    --rose-soft: #F7E4EA;
    --ink: #2A1F24;
    --muted: #7A6A70;
    --bg: #FFFBFC;
    --card: #FFFFFF;
    --line: #EBD9DF;
    --ok: #2E7D5B;
    --bad: #B23A48;
    --warn: #8A5A1B;
    --warn-bg: #FBF0DD;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rose: #E79AB4; --rose-soft: #3A2630; --ink: #F4EAEE;
      --muted: #B5A3AB; --bg: #1A1115; --card: #241920; --line: #3A2B31;
      --ok: #6FD6A6; --bad: #F08A96; --warn: #F0C27C; --warn-bg: #3A2E1C;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 16px calc(32px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 560px; margin-inline: auto;
  }
  header { text-align: center; margin-bottom: 24px; }
  .mark {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--rose); margin: 0 auto 10px;
    display: grid; place-items: center; color: #fff; font-size: 24px;
  }
  h1 { font-size: 21px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 14px;
  }
  .card.accent { background: var(--rose-soft); }
  .label {
    font-size: 12px; margin: 0 0 6px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }

  /* The one number the app exists to show. */
  .countdown { font-size: 40px; font-weight: 700; line-height: 1.1; margin: 0 0 4px; letter-spacing: -0.02em; }
  .window { font-size: 15px; margin: 0; color: var(--ink); }
  .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .fact .v { font-size: 20px; font-weight: 650; }
  .fact .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .pill {
    display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--bg);
  }
  .banner {
    background: var(--warn-bg); border: 1px solid var(--warn); color: var(--warn);
    border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px;
  }

  button {
    width: 100%; padding: 15px 20px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--rose); color: #fff;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .45; }
  button.quiet { background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; padding: 10px; }

  input[type=password] {
    width: 100%; padding: 14px; font-size: 17px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 10px;
  }
  .err { color: var(--bad); font-size: 14px; margin: 10px 0 0; }

  .fb { display: flex; gap: 8px; margin-top: 14px; }
  .fb button {
    flex: 1; padding: 11px; font-size: 15px; font-weight: 500;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  }
  .fb button:active { background: var(--rose-soft); }
  .fb-done { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
  .highlight { outline: 2px solid var(--rose); outline-offset: 2px; }

  details { margin-top: 18px; }
  summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  #log {
    margin-top: 10px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; white-space: pre-wrap; word-break: break-word; color: var(--muted);
  }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="mark">🌸</div>
  <h1>Petal Ping</h1>
  <p class="sub" id="subtitle">—</p>
</header>

<!-- Gate. Shown until a valid session cookie exists. -->
<section id="gate" hidden>
  <div class="card">
    <p class="label">Password</p>
    <form id="login-form">
      <input type="password" id="password" autocomplete="current-password"
             placeholder="Password" aria-label="Password">
      <button type="submit" id="login-btn">Sign in</button>
    </form>
    <p class="err" id="login-err" hidden></p>
    <p class="note">This page shows personal health data, so it stays behind a password.</p>
  </div>
</section>

<!-- The companion view proper. -->
<main id="app" hidden>
  <div class="banner" id="stale" hidden></div>

  <div class="card accent">
    <p class="label">Next period</p>
    <p class="countdown" id="countdown">—</p>
    <p class="window" id="window">—</p>
    <p class="note" id="confidence"></p>
  </div>

  <div class="facts">
    <div class="fact"><div class="v" id="cycle-day">—</div><div class="k">Cycle day</div></div>
    <div class="fact"><div class="v" id="phase">—</div><div class="k">Phase</div></div>
  </div>

  <div class="card" id="today-card" hidden style="margin-top:14px">
    <p class="label">Today's note</p>
    <p id="today-title" style="font-weight:600;margin:0 0 4px"></p>
    <p id="today-body" style="margin:0;font-size:15px"></p>
    <div class="fb" id="fb">
      <button type="button" data-action="useful">👍 Useful</button>
      <button type="button" data-action="not-useful">👎 Not useful</button>
    </div>
    <p class="fb-done" id="fb-done" hidden></p>
  </div>

  <div class="card">
    <p class="label">Notifications</p>
    <p id="push-state" style="margin:0 0 12px;font-size:15px">Checking…</p>
    <button id="enable" disabled>Enable notifications</button>
    <button class="quiet" id="test-push" hidden>Send a test notification</button>
    <p class="note" id="test-result" hidden></p>
  </div>

  <details>
    <summary>Diagnostics</summary>
    <div id="log"></div>
  </details>

  <button class="quiet" id="signout">Sign out</button>
</main>

<script>
const VAPID_PUBLIC_KEY = "BATreQOeV8CzLSYK5-4d4dHTbAfEXDi_Xz8agVumOHEjBEnLTz8u327exOYalRq16j4Gpm8wcAEy4g6CRBVtHt0";

const $ = (id) => document.getElementById(id);

function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  $("log").appendChild(line);
}

// iOS only allows Web Push once the app has been added to the Home Screen.
// Running in a Safari tab fails at subscribe() with an unhelpful error, so
// check up front and say so plainly instead.
const isStandalone =
  window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

const fmt = (iso) =>
  new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });

// --- gate ------------------------------------------------------------------

async function start() {
  const res = await fetch("/api/prediction");
  if (res.status === 401) {
    $("gate").hidden = false;
    $("subtitle").textContent = "Sign in to see your predictions";
    $("password").focus();
    return;
  }
  render(await res.json());
}

$("login-form").onsubmit = async (e) => {
  e.preventDefault();
  const btn = $("login-btn");
  const err = $("login-err");
  btn.disabled = true;
  err.hidden = true;

  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("password").value }),
  });
  const body = await res.json().catch(() => ({}));

  if (res.ok) {
    $("password").value = "";
    $("gate").hidden = true;
    start();
    return;
  }

  err.textContent = body.attemptsRemaining !== undefined
    ? `${body.error} — ${body.attemptsRemaining} attempts left`
    : (body.error || "Sign in failed");
  err.hidden = false;
  btn.disabled = false;
};

$("signout").onclick = async () => {
  await fetch("/api/login", { method: "DELETE" });
  location.reload();
};

// --- the view --------------------------------------------------------------

function render(data) {
  $("app").hidden = false;
  $("subtitle").textContent = "Your cycle at a glance";

  const p = data.prediction;
  if (!p) {
    $("countdown").textContent = "No data";
    $("window").textContent = "Run an ingest to upload a prediction.";
    return;
  }

  const days = data.days_until_window;
  if (days > 0)        $("countdown").textContent = `in ${days} day${days === 1 ? "" : "s"}`;
  else if (days === 0) $("countdown").textContent = "expected today";
  else                 $("countdown").textContent = `${Math.abs(days)} day${days === -1 ? "" : "s"} late`;

  $("window").textContent = `${fmt(p.window_start)} – ${fmt(p.window_end)}`;

  // Confidence is stated, never implied. With two cycles observed the honest
  // answer is "low", and the UI should say so rather than show a crisp date.
  $("confidence").innerHTML =
    `<span class="pill">${p.confidence} confidence</span> ` +
    `from ${p.complete_cycles} complete cycle${p.complete_cycles === 1 ? "" : "s"}` +
    (p.avg_cycle_length ? ` · avg ${p.avg_cycle_length} days` : "");

  $("cycle-day").textContent = data.cycle_day ?? "—";
  $("phase").textContent = data.phase ? data.phase[0].toUpperCase() + data.phase.slice(1) : "—";

  if (data.today) {
    $("today-card").hidden = false;
    $("today-title").textContent = data.today.title;
    $("today-body").textContent = data.today.body;
    // Arrived by tapping a notification: show and rate THAT notification, not
    // whatever the rules would pick right now. A tone sample carries its own
    // text in the link; a normal rule notification just carries its tag.
    const params = new URLSearchParams(location.search);
    const from = params.get("note");
    if (from) {
      if (params.get("b")) {
        $("today-title").textContent = params.get("t") || "Petal Ping";
        $("today-body").textContent = params.get("b");
      }
      $("today-card").classList.add("highlight");
      $("today-card").scrollIntoView({ block: "center" });
      history.replaceState(null, "", location.pathname);
    }
    setupFeedback(from || data.today.rule);
  }

  // Ingest is manual (D10), so staleness has to be visible rather than silent.
  if (data.age_days !== null && data.age_days > 21) {
    $("stale").hidden = false;
    $("stale").textContent =
      `This prediction is ${data.age_days} days old. Export from Clue and re-ingest ` +
      `to keep notifications accurate.`;
  }

  initPush();
}

// --- feedback (PRD Q6) ------------------------------------------------------
//
// iOS does not render notification action buttons, so the thumbs live here and
// a notification tap deep-links in with ?note=<tag>. Rated tags are remembered
// locally so the buttons do not re-ask; the server keeps the real log.

const RATED_KEY = "pp-rated";

function ratedTags() {
  try { return JSON.parse(localStorage.getItem(RATED_KEY) || "[]"); }
  catch { return []; }
}

function markRated(tag, action) {
  try {
    const all = ratedTags();
    all.push(tag);
    localStorage.setItem(RATED_KEY, JSON.stringify(all.slice(-50)));
  } catch { /* private mode -- the server still has it */ }
  showRated(action);
}

function showRated(action) {
  $("fb").hidden = true;
  $("fb-done").hidden = false;
  $("fb-done").textContent =
    action === "useful" ? "Logged — thanks. 👍" : "Logged. Fewer like this. 👎";
}

function setupFeedback(tag) {
  if (!tag) { $("fb").hidden = true; return; }

  // The tag a test push sends is prefixed; rate the underlying rule.
  const ruleTag = tag.replace(/^test-/, "");
  if (ratedTags().includes(ruleTag)) { showRated("useful"); $("fb-done").textContent = "Already rated today."; return; }

  $("fb").hidden = false;
  for (const btn of $("fb").querySelectorAll("button")) {
    btn.onclick = async () => {
      const action = btn.dataset.action;
      for (const b of $("fb").querySelectorAll("button")) b.disabled = true;
      // The endpoint needs a valid session. If the cookie has expired the tap
      // must say so -- a thumb that silently vanishes is worse than an error,
      // because the log would look sparse rather than broken.
      try {
        const res = await fetch("/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, tag: ruleTag, at: new Date().toISOString() }),
        });
        if (res.ok) {
          log("feedback recorded: " + action + " / " + ruleTag, "ok");
          markRated(ruleTag, action);
        } else if (res.status === 401) {
          $("fb-done").hidden = false;
          $("fb-done").textContent = "Not recorded — signed out. Sign in and try again.";
          log("feedback rejected: not signed in", "bad");
          for (const b of $("fb").querySelectorAll("button")) b.disabled = false;
        } else {
          $("fb-done").hidden = false;
          $("fb-done").textContent = "Not recorded (error " + res.status + ").";
          log("feedback failed: " + res.status, "bad");
          for (const b of $("fb").querySelectorAll("button")) b.disabled = false;
        }
      } catch (err) {
        $("fb-done").hidden = false;
        $("fb-done").textContent = "Not recorded — no connection.";
        log("feedback failed: " + err.message, "bad");
        for (const b of $("fb").querySelectorAll("button")) b.disabled = false;
      }
    };
  }
}

// --- push ------------------------------------------------------------------

async function initPush() {
  log("standalone (added to Home Screen): " + isStandalone);
  log("serviceWorker supported: " + ("serviceWorker" in navigator));
  log("PushManager supported: " + ("PushManager" in window));

  if (!isStandalone) {
    $("push-state").innerHTML =
      "Open in <b>Safari</b> → Share → <b>Add to Home Screen</b>, then open it from there. " +
      "iOS only allows notifications from a Home Screen app.";
    log("Not running from Home Screen — cannot enable push yet.", "bad");
    return;
  }
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    $("push-state").textContent = "This device does not support Web Push (needs iOS 16.4+).";
    log("Missing required browser APIs.", "bad");
    return;
  }

  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    log("service worker ready", "ok");

    const existing = await reg.pushManager.getSubscription();
    if (existing && Notification.permission === "granted") {
      $("push-state").textContent = "On. You'll get at most one notification a day.";
      $("enable").textContent = "Re-register this device";
      $("test-push").hidden = false;
      log("existing subscription found", "ok");
    } else {
      $("push-state").textContent = "Tap below, then allow notifications when iOS asks.";
    }
    $("enable").disabled = false;
    $("enable").onclick = () => enable(reg);
  } catch (err) {
    log("service worker failed: " + err.message, "bad");
    $("push-state").textContent = "Could not start the service worker. See diagnostics.";
  }
}

async function enable(reg) {
  $("enable").disabled = true;
  try {
    // Must be called from a user gesture on iOS.
    const permission = await Notification.requestPermission();
    log("permission: " + permission, permission === "granted" ? "ok" : "bad");
    if (permission !== "granted") {
      $("push-state").textContent = "Notifications are blocked. Enable them in Settings → Petal Ping.";
      return;
    }

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    log("push subscription created", "ok");

    const res = await fetch("/api/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sub),
    });
    const body = await res.json();

    if (res.ok) {
      log("server accepted subscription — test push sent", "ok");
      $("push-state").textContent = "On. A test notification should arrive in a moment.";
      $("test-push").hidden = false;
    } else {
      log("server error: " + (body.error || res.status), "bad");
      $("push-state").textContent = "Subscribed, but the server could not send. See diagnostics.";
    }
  } catch (err) {
    log("failed: " + err.message, "bad");
    $("push-state").textContent = "Something went wrong. See diagnostics.";
    $("enable").disabled = false;
  }
}

// Sends today's real notification on demand -- same rules engine the cron
// uses, so this tests the actual thing rather than a stand-in.
$("test-push").onclick = async () => {
  const btn = $("test-push"), out = $("test-result");
  btn.disabled = true;
  out.hidden = false;
  out.textContent = "Sending…";

  try {
    const res = await fetch("/api/test-push", { method: "POST" });
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      out.textContent = `Sent${body.rule ? " (" + body.rule + ")" : ""} — check your lock screen.`;
      log("test push sent: " + (body.rule || "fallback"), "ok");
    } else {
      out.textContent = body.error || `Failed (${res.status})`;
      log("test push failed: " + (body.error || res.status), "bad");
      if (body.subscriptionExpired) {
        $("push-state").textContent = "This device's subscription expired. Tap Re-register.";
      }
    }
  } catch (err) {
    out.textContent = "Failed: " + err.message;
    log("test push error: " + err.message, "bad");
  }
  btn.disabled = false;
};

start();
</script>
</body>
</html>
