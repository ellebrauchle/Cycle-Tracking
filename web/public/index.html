<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petal Ping</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#B4476B">
<style>
  :root {
    --rose: #B4476B;
    --rose-soft: #F7E4EA;
    --ink: #2A1F24;
    --muted: #7A6A70;
    --bg: #FFFBFC;
    --line: #EBD9DF;
    --ok: #2E7D5B;
    --bad: #B23A48;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rose: #E79AB4; --rose-soft: #3A2630; --ink: #F4EAEE;
      --muted: #B5A3AB; --bg: #1A1115; --line: #3A2B31;
      --ok: #6FD6A6; --bad: #F08A96;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 560px; margin-inline: auto;
  }
  header { text-align: center; margin-bottom: 28px; }
  .mark {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--rose); margin: 0 auto 12px;
    display: grid; place-items: center; color: #fff; font-size: 26px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }

  .card {
    background: var(--rose-soft); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 8px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
  .card p { margin: 0; font-size: 15px; }

  button {
    width: 100%; padding: 15px 20px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--rose); color: #fff;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .45; }

  #log {
    margin-top: 20px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: transparent; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; white-space: pre-wrap; word-break: break-word; color: var(--muted);
    min-height: 60px;
  }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>

<header>
  <div class="mark">🌸</div>
  <h1>Petal Ping</h1>
  <p class="sub">Push notification test</p>
</header>

<div class="card" id="step">
  <h2>Step 1</h2>
  <p id="step-text">Checking how this page was opened…</p>
</div>

<button id="enable" disabled>Enable notifications</button>

<div id="log">Starting…</div>

<script>
const VAPID_PUBLIC_KEY = "BATreQOeV8CzLSYK5-4d4dHTbAfEXDi_Xz8agVumOHEjBEnLTz8u327exOYalRq16j4Gpm8wcAEy4g6CRBVtHt0";

const logEl  = document.getElementById("log");
const btn    = document.getElementById("enable");
const stepEl = document.getElementById("step-text");

function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
}

// iOS only allows Web Push once the app has been added to the Home Screen.
// Running in a Safari tab will fail at subscribe() with an unhelpful error,
// so check up front and say so plainly instead.
const isStandalone =
  window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function init() {
  logEl.textContent = "";
  log("standalone (added to Home Screen): " + isStandalone);
  log("serviceWorker supported: " + ("serviceWorker" in navigator));
  log("PushManager supported: " + ("PushManager" in window));
  log("Notification supported: " + ("Notification" in window));

  if (!isStandalone) {
    stepEl.innerHTML =
      "Open this page in <b>Safari</b>, tap the <b>Share</b> button, " +
      "then <b>Add to Home Screen</b>. Open it from your Home Screen and come back here.<br><br>" +
      "iOS only allows notifications from a Home Screen app — not from a browser tab.";
    log("Not running from Home Screen — cannot enable push yet.", "bad");
    return;
  }

  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    stepEl.textContent = "This device does not support Web Push. You need iOS 16.4 or later.";
    log("Missing required browser APIs.", "bad");
    return;
  }

  try {
    const reg = await navigator.serviceWorker.register("/sw.js");
    log("service worker registered", "ok");
    await navigator.serviceWorker.ready;
    log("service worker ready", "ok");

    stepEl.textContent = "Tap the button below, then allow notifications when iOS asks.";
    btn.disabled = false;
    btn.onclick = () => enable(reg);
  } catch (err) {
    log("service worker failed: " + err.message, "bad");
    stepEl.textContent = "Could not start the service worker. See the log below.";
  }
}

async function enable(reg) {
  btn.disabled = true;
  try {
    // Must be called from a user gesture on iOS.
    const permission = await Notification.requestPermission();
    log("permission: " + permission, permission === "granted" ? "ok" : "bad");
    if (permission !== "granted") {
      stepEl.textContent = "Notifications were blocked. Enable them in Settings → Petal Ping.";
      return;
    }

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    log("push subscription created", "ok");

    const res = await fetch("/api/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(sub),
    });
    const body = await res.json();

    if (res.ok) {
      log("server accepted subscription — test push sent", "ok");
      stepEl.textContent = "Done. A test notification should arrive in a moment.";
    } else {
      log("server error: " + (body.error || res.status), "bad");
      stepEl.textContent = "Subscribed, but the server could not send. See the log.";
    }
  } catch (err) {
    log("failed: " + err.message, "bad");
    stepEl.textContent = "Something went wrong. See the log below.";
    btn.disabled = false;
  }
}

init();
</script>
</body>
</html>
